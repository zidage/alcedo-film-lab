[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "alcedo-film-tables"
version = "0.1.0"
description = "Construction of the spectral tables of the Alcedo film model (step P7)"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.29"
cmake.build-type = "Release"
wheel.packages = []
wheel.install-dir = "."
